<form [formGroup]="formulario" (ngSubmit)="onSubmit()" class="max-w-md mx-auto p-6 bg-white rounded-lg shadow-lg">
    <h1 class="text-3xl font-semibold text-center text-gray-700 mb-6">Registro en Task Manager</h1>
    
    <div class="mb-4">
      <label for="username" class="block text-sm font-medium text-gray-600">Usuario</label>
      <input 
        type="text" 
        id="username" 
        formControlName="username" 
        class="mt-1 p-3 w-full border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    
    <div class="mb-4">
      <label for="email" class="block text-sm font-medium text-gray-600">Correo</label>
      <input 
        type="email" 
        id="email" 
        formControlName="email" 
        class="mt-1 p-3 w-full border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    
    <div class="mb-6">
      <label for="password" class="block text-sm font-medium text-gray-600">Contraseña</label>
      <input 
        type="password" 
        id="password" 
        formControlName="password" 
        class="mt-1 p-3 w-full border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    
    <button 
      type="submit" 
      class="w-full bg-blue-500 text-white p-3 rounded-md font-semibold hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
      Registrar
    </button>
  
    <div class="mt-4 text-center">
      <p class="text-sm text-gray-600">Ya tienes una cuenta creada? 
        <a routerLink="/login" class="text-blue-500 hover:underline">Inicie sesión</a>
      </p>
    </div>
  </form>
