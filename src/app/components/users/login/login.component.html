<form [formGroup]="formulario" (ngSubmit)="onSubmit()" class="max-w-md mx-auto p-6 bg-white rounded-lg shadow-lg">
  <div class="space-y-6">
    <h1 class="text-3xl font-semibold text-center text-gray-700">Iniciar sesión en Task Manager</h1>

    <div>
      <label for="email" class="block text-sm font-medium text-gray-600">Email</label>
      <input 
        type="email" 
        id="email" 
        formControlName="email" 
        class="mt-1 p-3 w-full border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-gray-600">Password</label>
      <input 
        type="password" 
        id="password" 
        formControlName="password" 
        class="mt-1 p-3 w-full border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <button type="submit" 
      class="w-full bg-blue-500 text-white rounded-md font-semibold ">
      Iniciar
    </button>

    <div class="text-center">
      <p class="text-sm text-gray-600">No tienes una cuenta? 
        <a routerLink="/register" class="text-blue-500 hover:underline">Regístrate ahora</a>
      </p>
    </div>
  </div>
</form>
